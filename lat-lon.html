<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance-Based Lab Booking</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font -->
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 sm:p-8">

    <div id="app" class="max-w-4xl mx-auto">
        <header class="text-center mb-8 p-6 bg-white shadow-lg rounded-xl">
            <h1 class="text-3xl font-bold text-gray-800">Lab Center Visit Distance Calculator</h1>
            <p class="text-gray-500 mt-2">Enter your location to find the nearest labs and book a slot.</p>
        </header>

        <section id="user-input-section" class="bg-white p-6 rounded-xl shadow-lg mb-8">
            <h2 class="text-xl font-semibold text-indigo-600 mb-4 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Your Location
            </h2>
            <div class="space-y-4 md:flex md:space-y-0 md:space-x-4">
                <input type="number" id="user-lat" placeholder="Enter Latitude (e.g., 28.58)" value="28.60" class="flex-1 p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" step="0.00000001">
                <input type="number" id="user-lng" placeholder="Enter Longitude (e.g., 77.05)" value="77.07" class="flex-1 p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" step="0.00000001">
            </div>
            <button onclick="calculateAndDisplayDistances()" class="mt-4 w-full bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700 transition duration-200 shadow-md">
                Find Nearest Labs
            </button>
        </section>

        <section id="results-section" class="bg-white p-6 rounded-xl shadow-lg" style="display:none;">
            <h2 class="text-xl font-semibold text-green-600 mb-6">Available Labs with Distance</h2>
            <div id="labs-container" class="space-y-6">
                <!-- Lab cards will be injected here -->
            </div>
        </section>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden text-center p-6">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
            <p class="mt-4 text-indigo-600">Calculating distances...</p>
        </div>
        
        <!-- Auth Status/User Info -->
        <footer class="mt-8 text-center text-xs text-gray-400">
            <p>Authentication Status: <span id="auth-status" class="font-medium text-red-500">Initializing...</span></p>
            <p>User ID: <span id="user-id-display" class="font-mono text-gray-500">N/A</span></p>
        </footer>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Setup (Mandatory Globals) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // Disable Firebase logging for production, enable for debugging
        // setLogLevel('Debug');

        let app;
        let db;
        let auth;
        let userId = 'N/A';

        window.firebaseInitPromise = (async () => {
            try {
                if (Object.keys(firebaseConfig).length === 0) {
                    console.warn("Firebase config is empty. Functionality limited.");
                    document.getElementById('auth-status').textContent = 'Config Missing';
                    return;
                }
                
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                const authStatusEl = document.getElementById('auth-status');
                const userIdEl = document.getElementById('user-id-display');

                // 1. Sign in using the custom token or anonymously
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                // 2. Set up auth state observer
                return new Promise((resolve) => {
                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            userId = user.uid;
                            authStatusEl.textContent = 'Authenticated';
                            authStatusEl.classList.remove('text-red-500');
                            authStatusEl.classList.add('text-green-500');
                            userIdEl.textContent = userId;
                        } else {
                            userId = crypto.randomUUID(); // Fallback UUID if sign-in fails
                            authStatusEl.textContent = 'Anonymous';
                            userIdEl.textContent = userId;
                        }
                        resolve(true); // Resolve the promise once auth state is settled
                    });
                });

            } catch (error) {
                console.error("Firebase Initialization/Authentication Error:", error);
                document.getElementById('auth-status').textContent = 'Error';
                document.getElementById('auth-status').classList.remove('text-red-500');
                document.getElementById('auth-status').classList.add('text-yellow-500');
            }
        })();
    </script>

    <script>
        // --- Core Application Logic ---

        // List of labs with center visit options (Static Data)
        const LAB_DATA = [
            { id: 1, name: "Prognosis Laboratory", lat: 28.58043637004601, lng: 77.05100359593791, bookingTimes: ["9:00 AM", "11:00 AM", "2:00 PM"] },
            { id: 2, name: "City Diagnostics Center", lat: 28.6257, lng: 77.2182, bookingTimes: ["10:30 AM", "1:30 PM", "4:30 PM"] },
            { id: 3, name: "HealthCheck Lab (South)", lat: 28.501, lng: 77.085, bookingTimes: ["8:00 AM", "12:00 PM"] },
            { id: 4, name: "Fast Results PathLab (Central)", lat: 28.6400, lng: 77.1200, bookingTimes: ["9:30 AM", "3:00 PM", "5:00 PM"] },
            { id: 5, name: "Premium Wellness Labs", lat: 28.555, lng: 77.035, bookingTimes: ["8:30 AM", "1:00 PM", "3:30 PM"] },
        ];

        /**
         * Calculates the distance between two geographical points using the Haversine formula.
         * @param {number} lat1 Latitude of point 1
         * @param {number} lon1 Longitude of point 1
         * @param {number} lat2 Latitude of point 2
         * @param {number} lon2 Longitude of point 2
         * @returns {string} The distance in kilometers, fixed to 2 decimal places.
         */
        const calculateDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371; // Radius of Earth in kilometers
            const toRad = (degrees) => degrees * (Math.PI / 180);

            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);

            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            const distance = R * c; // Distance in km
            
            return distance.toFixed(2);
        };

        /**
         * Renders the lab cards with calculated distances and booking times.
         * @param {Array<Object>} calculatedLabs Array of lab objects including the distance.
         */
        const renderLabs = (calculatedLabs) => {
            const container = document.getElementById('labs-container');
            container.innerHTML = ''; // Clear previous results

            calculatedLabs.sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));

            calculatedLabs.forEach(lab => {
                const distanceColor = parseFloat(lab.distance) < 5 ? 'text-green-600' : 'text-yellow-600';
                
                const cardHtml = `
                    <div class="p-4 border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition duration-200 bg-gray-50">
                        <h3 class="text-lg font-bold text-gray-800">${lab.name}</h3>
                        <p class="text-sm text-gray-500 mb-3">Location: ${lab.lat.toFixed(6)}, ${lab.lng.toFixed(6)}</p>
                        
                        <div class="mt-4 border-t pt-3">
                            <h4 class="text-md font-semibold text-gray-700 mb-2">Available Booking Slots:</h4>
                            <div class="flex flex-wrap gap-3">
                                ${lab.bookingTimes.map(time => `
                                    <button 
                                        class="p-2 text-sm rounded-full bg-indigo-100 hover:bg-indigo-200 text-indigo-800 transition duration-150 shadow-sm"
                                        onclick="handleBookingClick('${lab.name}', '${time}', '${lab.distance}')"
                                        title="Click to book ${time}"
                                    >
                                        ${time} 
                                        <span class="font-bold ml-1 ${distanceColor}">
                                            (${lab.distance} km)
                                        </span>
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        };

        /**
         * Main function to retrieve inputs, calculate distances, and display results.
         */
        window.calculateAndDisplayDistances = async () => {
            // Wait for Firebase to initialize/authenticate before proceeding (Best Practice)
            if (typeof window.firebaseInitPromise !== 'undefined') {
                await window.firebaseInitPromise;
            }
            
            const latInput = document.getElementById('user-lat').value;
            const lngInput = document.getElementById('user-lng').value;
            const resultsSection = document.getElementById('results-section');
            const loadingIndicator = document.getElementById('loading');
            
            loadingIndicator.classList.remove('hidden');
            resultsSection.style.display = 'none';

            const userLat = parseFloat(latInput);
            const userLng = parseFloat(lngInput);

            if (isNaN(userLat) || isNaN(userLng) || userLat < -90 || userLat > 90 || userLng < -180 || userLng > 180) {
                alertModal("Invalid Coordinates", "Please enter valid latitude (-90 to 90) and longitude (-180 to 180) values.");
                loadingIndicator.classList.add('hidden');
                return;
            }

            // Calculate distance for all labs
            const calculatedLabs = LAB_DATA.map(lab => {
                const distance = calculateDistance(userLat, userLng, lab.lat, lab.lng);
                return { ...lab, distance };
            });

            // Simulate a network delay (for better UX when showing loading state)
            await new Promise(resolve => setTimeout(resolve, 500)); 

            renderLabs(calculatedLabs);
            
            loadingIndicator.classList.add('hidden');
            resultsSection.style.display = 'block';
        };

        /**
         * Simulates the booking action and uses a custom modal instead of alert().
         * @param {string} labName Name of the lab.
         * @param {string} time Booking time.
         * @param {string} distance Calculated distance.
         */
        window.handleBookingClick = (labName, time, distance) => {
            const message = `You are attempting to book a visit at:\n\n` +
                            `Lab: ${labName}\n` +
                            `Time: ${time}\n` +
                            `Distance from your location: ${distance} km\n\n` +
                            `Confirm to proceed with booking.`;
            
            alertModal("Confirm Booking", message);
            // In a real application, you would proceed to a payment/confirmation screen here.
        };

        /**
         * Custom Modal Function (replaces alert/confirm)
         */
        const alertModal = (title, message) => {
            let modal = document.getElementById('custom-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'custom-modal';
                modal.className = 'fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 transition-opacity duration-300 hidden';
                modal.innerHTML = `
                    <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full transform transition-all duration-300 scale-90">
                        <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-3 border-b pb-2"></h3>
                        <p id="modal-message" class="text-gray-600 whitespace-pre-line mb-4"></p>
                        <div class="flex justify-end">
                            <button onclick="document.getElementById('custom-modal').classList.add('hidden');" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition duration-150 shadow-md">
                                Close
                            </button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            }

            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            modal.classList.remove('hidden');
            // Animate in
            modal.querySelector('div').classList.remove('scale-90');
            modal.querySelector('div').classList.add('scale-100');
        };

        // Initialize the display on load
        window.onload = () => {
             // We do not call calculateAndDisplayDistances() here, we wait for user interaction,
             // but we ensure the initial coordinate values are set for convenience.
        };
    </script>
</body>
</html>
