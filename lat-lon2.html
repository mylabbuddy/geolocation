<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearest Diagnostic Labs</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for aesthetic appeal */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
        }
        .container-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .lab-item:nth-child(1) {
            border-left: 4px solid #10b981; /* Green for the nearest one */
            background-color: #ecfdf5;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-2xl bg-white p-6 md:p-10 rounded-xl container-shadow">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Diagnostic Lab Locator</h1>
        <p class="text-gray-500 mb-6">Find the nearest labs in Delhi and Gurugram sorted by distance from your current location.</p>

        <!-- Current Location Display -->
        <div id="location-info" class="bg-blue-50 p-4 rounded-lg mb-6 text-sm text-blue-700">
            Current Location: <span id="user-coords" class="font-semibold text-gray-700">Awaiting location...</span>
        </div>

        <!-- Action Button -->
        <button id="find-button" class="w-full flex items-center justify-center py-3 px-4 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition duration-300 disabled:opacity-50">
            <span id="button-text">Find Nearest Labs</span>
            <div id="loading-spinner" class="spinner ml-3 hidden"></div>
        </button>

        <!-- Results and Error Container -->
        <div id="results-container" class="mt-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4 border-b pb-2 hidden" id="results-title">Labs Sorted by Proximity:</h2>
            <div id="lab-list" class="space-y-3">
                <!-- Results will be injected here -->
                <p id="initial-message" class="text-gray-500 text-center py-8">Click "Find Nearest Labs" above to start the search.</p>
            </div>
        </div>

    </div>

    <script>
        // --- Geolocation and Distance Calculation Logic ---

        // Earth's radius in kilometers (R)
        const R = 6371;

        // Predefined list of famous diagnostic labs in Delhi/Gurugram (approximate coordinates)
        const LAB_LOCATIONS = [
            { name: "Dr Lal PathLabs (Connaught Place, Delhi)", lat: 28.6324, lon: 77.2185, city: "Delhi" },
            { name: "SRL Diagnostics (Hauz Khas, Delhi)", lat: 28.5444, lon: 77.2023, city: "Delhi" },
            { name: "Metropolis Healthcare (Cyber City, Gurugram)", lat: 28.4900, lon: 77.0900, city: "Gurugram" },
            { name: "Redcliffe Labs (Old Gurugram Road)", lat: 28.4608, lon: 77.0274, city: "Gurugram" },
            { name: "Thyrocare (Rohini, Delhi)", lat: 28.7121, lon: 77.1121, city: "Delhi" },
            { name: "Max Lab (Noida Sector 62)", lat: 28.6253, lon: 77.3755, city: "NCR" },
            { name: "Apollo Diagnostics (Faridabad)", lat: 28.4089, lon: 77.3178, city: "NCR" }
        ];

        // Utility function to convert degrees to radians
        const degToRad = (deg) => deg * (Math.PI / 180);

        /**
         * Calculates the distance between two points on the Earth's surface
         * using the Haversine formula.
         * @param {number} lat1 - Latitude of point 1 (User).
         * @param {number} lon1 - Longitude of point 1 (User).
         * @param {number} lat2 - Latitude of point 2 (Lab).
         * @param {number} lon2 - Longitude of point 2 (Lab).
         * @returns {number} Distance in kilometers.
         */
        const calculateDistance = (lat1, lon1, lat2, lon2) => {
            const dLat = degToRad(lat2 - lat1);
            const dLon = degToRad(lon2 - lon1);

            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(degToRad(lat1)) * Math.cos(degToRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c; // Distance in km
        };

        /**
         * Renders the error message in the lab-list container.
         * @param {string} message - The error message to display.
         */
        const displayError = (message) => {
            document.getElementById('lab-list').innerHTML = `
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                    <strong class="font-bold">Error!</strong>
                    <span class="block sm:inline"> ${message}</span>
                </div>
            `;
            document.getElementById('results-title').classList.add('hidden');
        };

        /**
         * Processes the user's location and calculates/displays the distances.
         * @param {GeolocationPosition} position - The result object from the Geolocation API.
         */
        const processLocation = (position) => {
            const userLat = position.coords.latitude;
            const userLon = position.coords.longitude;

            // Update UI with user coordinates
            document.getElementById('user-coords').textContent =
                `${userLat.toFixed(4)}° N, ${userLon.toFixed(4)}° E`;

            // 1. Calculate distance for all labs
            const labsWithDistance = LAB_LOCATIONS.map(lab => {
                const distanceKm = calculateDistance(userLat, userLon, lab.lat, lab.lon);
                return {
                    ...lab,
                    distance: distanceKm
                };
            });

            // 2. Sort from nearest to farthest
            labsWithDistance.sort((a, b) => a.distance - b.distance);

            // 3. Render the results list
            const labListHtml = labsWithDistance.map((lab, index) => `
                <div class="lab-item p-4 bg-gray-50 rounded-lg shadow-sm transition duration-150 border border-gray-200">
                    <p class="font-bold text-lg text-gray-800">${index + 1}. ${lab.name}</p>
                    <p class="text-sm text-gray-600">
                        <span class="font-semibold text-indigo-600">${lab.distance.toFixed(2)} km</span> away
                        <span class="ml-4 text-xs text-gray-400">(${lab.city})</span>
                    </p>
                    <p class="text-xs text-gray-400 mt-1">Coordinates: ${lab.lat.toFixed(4)} N, ${lab.lon.toFixed(4)} E</p>
                </div>
            `).join('');

            document.getElementById('lab-list').innerHTML = labListHtml;
            document.getElementById('results-title').classList.remove('hidden');
            document.getElementById('initial-message').classList.add('hidden');
        };

        /**
         * Handles the click event to initiate the location finding process.
         */
        const findNearestLabs = () => {
            const button = document.getElementById('find-button');
            const buttonText = document.getElementById('button-text');
            const spinner = document.getElementById('loading-spinner');

            // Set loading state
            button.disabled = true;
            buttonText.textContent = 'Locating you...';
            spinner.classList.remove('hidden');
            document.getElementById('lab-list').innerHTML = `<p class="text-center text-gray-500 py-4">Waiting for browser location permission...</p>`;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        // Success Handler
                        processLocation(position);
                        button.disabled = false;
                        buttonText.textContent = 'Recalculate Distance';
                        spinner.classList.add('hidden');
                    },
                    (error) => {
                        // Error Handler
                        let errorMessage = "Could not retrieve your location. Check your device settings and ensure location services are enabled.";
                        if (error.code === error.PERMISSION_DENIED) {
                            errorMessage = "Location access was denied. Please allow location access in your browser settings to find the nearest labs.";
                        } else if (error.code === error.TIMEOUT) {
                            errorMessage = "Location request timed out. Please try again.";
                        }
                        displayError(errorMessage);
                        button.disabled = false;
                        buttonText.textContent = 'Try Again';
                        spinner.classList.add('hidden');
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                // Geolocation not supported
                displayError("Geolocation is not supported by your browser.");
                button.disabled = true;
                buttonText.textContent = 'Not Supported';
                spinner.classList.add('hidden');
            }
        };

        // Attach event listener to the button
        document.getElementById('find-button').addEventListener('click', findNearestLabs);

    </script>
</body>
</html>
